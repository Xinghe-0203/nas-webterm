[package]
name = "nas-webterm"
version = "1.2.6"
edition = "2021"
description = "飞牛 NAS 浏览器多标签页 Web 终端（root PTY）"
license = "MIT"

[[bin]]
name = "nas-webterm"
path = "src/main.rs"

[features]
# AI 助手。普通版用 --no-default-features 编译，AI 相关代码**根本不进二进制**。
default = ["ai"]
ai = []

[dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
    "fs",
    "process",
] }
axum = { version = "0.8", features = ["ws"] }
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
