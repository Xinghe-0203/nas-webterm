[package]
name = "nas-webterm"
version = "1.0.1"
edition = "2021"
description = "飞牛 NAS 浏览器多标签页 Web 终端（root PTY）"
license = "MIT"

[[bin]]
name = "nas-webterm"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
    "fs",
] }
axum = { version = "0.8", features = ["ws"] }
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
